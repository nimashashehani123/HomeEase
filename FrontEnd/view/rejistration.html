<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab-Based Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Role Toggle */
    .role-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #FFD700;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    #roleLabel {
      font-size: 1rem;
      color: #000;
      font-weight: bold;
    }
  </style>

</head>
<body class="flex justify-center items-center min-h-screen bg-gray-100">
<!-- Navbar -->
<nav class="navbar">
  <div class="container">
    <a href="#" class="logo">HomeEase</a>
    <ul class="nav-links">
      <li><a href="#home" style="color: white">Home</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <!-- Role Selection Toggle -->
    <div class="role-toggle">
      <label class="switch">
        <input type="checkbox" id="roleToggle">
        <span class="slider"></span>
      </label>
      <span id="roleLabel">Customer</span>
    </div>
    <a href="#" class="login-btn"></a>
    <div class="hamburger" id="hamburger">
      <i class="fas fa-bars"></i>
    </div>
  </div>
</nav>
<script src="../js/jquery-3.7.1.min.js"></script>
<script>
  // Role Toggle Functionality
  const roleToggle = document.getElementById('roleToggle');
  const roleLabel = document.getElementById('roleLabel');

  roleToggle.addEventListener('change', function () {
    if (this.checked) {
      roleLabel.textContent = 'Provider';
      /*window.location.href = 'provider-login.html';*/ // Redirect to Provider Login Page
    } else {
      roleLabel.textContent = 'Customer';
     /* window.location.href = 'customer-login.html';*/ // Redirect to Customer Login Page
    }
  });
</script>
</body>
</html>
